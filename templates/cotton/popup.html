<c-vars id="popup" title="" class="" />
<div class="hidden h-full w-full fixed inset-0 bg-black/20 z-40"
     id="{{ id }}-overlay"></div>
<div id="{{ id }}"
     class="hidden fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50 {{ class }}">
  <div class="relative p-6 bg-white shadow-md rounded-lg z-10 min-w-[300px] space-y-2">
    <div class="flex justify-between items-center gap-4 mb-4">
      <h3 class="text-2xl font-semibold">{{ title }}</h3>
      <button type="button"
              class="close-popup-btn inline-flex items-center justify-center font-jua p-2 rounded-full text-navy-mama hover:bg-pink-mama/10"
              data-popup="{{ id }}">
        ✖
      </button>
    </div>
    {{ slot }}
  </div>
</div>
<script>
  (function() {
    const popup = document.getElementById('{{ id }}');
    const overlay = document.getElementById('{{ id }}-overlay');
    const triggers = document.querySelectorAll('[data-open-popup="{{ id }}"]');
    const closers = popup.querySelectorAll('.close-popup-btn');

    function open() {
      popup.classList.remove('hidden');
      overlay.classList.remove('hidden');
      document.body.classList.add('overflow-hidden');
    }

    function close() {
      popup.classList.add('hidden');
      overlay.classList.add('hidden');
      document.body.classList.remove('overflow-hidden');
    }

    triggers.forEach(btn => btn.addEventListener('click', open));
    closers.forEach(btn => btn.addEventListener('click', close));
    overlay.addEventListener('click', close);
    popup.addEventListener('click', (e) => { if (e.target === popup) close(); });
  })();
</script>
